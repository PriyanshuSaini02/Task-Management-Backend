name: Keep Server Alive

on:
  schedule:
    # Ping every 5 minutes to prevent Render free tier from sleeping
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Render backend health endpoint
        run: |
          if [ -z "${{ secrets.SERVER_URL }}" ]; then
            echo "SERVER_URL secret is not set in GitHub repo settings"
            exit 1
          fi
          curl -fsS "${{ secrets.SERVER_URL }}/api/health" && echo " - Server is alive"
